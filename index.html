<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دوام">
<title>دوام — إدارة فريقك وحساباتك</title>
<link rel="manifest" href="manifest.webmanifest">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.0/dist/umd/supabase.js"></script>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f5fa;--card:#ffffff;--card2:#f8f9fc;--tx:#0f1426;--tx2:#3b4257;--mut:#7a8199;--bd:#e7e9f2;--bd2:#dfe2ee;
 --pr:#4f46e5;--pr2:#7c6cf6;--prs:#eeedff;--teal:#0ea5a4;--teals:#e3f7f6;
 --ok:#059669;--oks:#e5f7ef;--bad:#e11d48;--bads:#fdebef;--warn:#d97706;--warns:#fff4e3;
 --ink:#0b1020;--sh:0 1px 2px rgba(15,20,38,.04),0 6px 24px rgba(15,20,38,.06);--sh2:0 10px 40px rgba(15,20,38,.16);
 --r:20px;--chatbg:#efeae2;--me:#dcd9ff;--them:#ffffff;
}
:root{--g1:#4f46e5;--g2:#7c3aed;--g3:#0ea5a4;--a1:#5b4bff;--a2:#10b4ae;--a3:#c04bff;--prsh:rgba(79,70,229,.3)}
[data-theme=dark]{
 --bg:#0a0e1a;--card:#121829;--card2:#0f1424;--tx:#eef0f8;--tx2:#c3c8d9;--mut:#8890a8;--bd:#1f2740;--bd2:#283150;
 --prs:#1e1d4a;--teals:#0d2c2d;--oks:#0c2a20;--bads:#33121c;--warns:#2e2210;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 40px rgba(0,0,0,.5);
 --chatbg:#0c1220;--me:#2f2a7a;--them:#1a2135}
[data-accent=gold]{--pr:#a87a24;--pr2:#d4a64a;--prs:#f7efe0;--g1:#1c1917;--g2:#6b4f1d;--g3:#d4a64a;--a1:#b8862f;--a2:#6b4f1d;--a3:#f2c46d;--prsh:rgba(168,122,36,.3);--me:#f3e6c8}
[data-accent=emerald]{--pr:#059669;--pr2:#10b981;--prs:#e6f6ef;--g1:#065f46;--g2:#059669;--g3:#14b8a6;--a1:#10b981;--a2:#0ea5a4;--a3:#34d399;--prsh:rgba(5,150,105,.3);--me:#d5f2e5}
[data-accent=ocean]{--pr:#0284c7;--pr2:#38bdf8;--prs:#e3f3fc;--g1:#0c4a6e;--g2:#0284c7;--g3:#14b8a6;--a1:#0ea5e9;--a2:#14b8a6;--a3:#6366f1;--prsh:rgba(2,132,199,.3);--me:#d3ecfa}
[data-accent=rose]{--pr:#db2777;--pr2:#ec4899;--prs:#fdeaf3;--g1:#9d174d;--g2:#db2777;--g3:#f97316;--a1:#ec4899;--a2:#f97316;--a3:#a855f7;--prsh:rgba(219,39,119,.3);--me:#fbd9ea}
[data-accent=noir]{--pr:#18181b;--pr2:#52525b;--prs:#ececef;--g1:#09090b;--g2:#27272a;--g3:#71717a;--a1:#3f3f46;--a2:#71717a;--a3:#a1a1aa;--prsh:rgba(0,0,0,.25);--me:#e4e4e7}
[data-theme=dark][data-accent=gold]{--prs:#2a2214;--me:#4a3a18}[data-theme=dark][data-accent=emerald]{--prs:#0d2a22;--me:#0f3f31}
[data-theme=dark][data-accent=ocean]{--prs:#0c2433;--me:#0f3a55}[data-theme=dark][data-accent=rose]{--prs:#33121f;--me:#5a1b38}
[data-theme=dark][data-accent=noir]{--pr:#e4e4e7;--pr2:#a1a1aa;--prs:#27272a;--me:#3f3f46}
[data-theme=dark][data-accent=noir] .btn:not(.gh):not(.ln):not(.ok):not(.bad):not(.dk){color:#09090b}
[data-fs=lg] body{zoom:1.08}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.hide{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--pr)}
svg{flex:none}
/* ---------- aurora ---------- */
.aur{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 120% at 100% 0%,#1b1f4a 0%,#0b1020 55%)}
.aur i{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;mix-blend-mode:screen;animation:fl 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:260px;height:260px;background:var(--a1);top:-110px;right:-60px}
.aur i:nth-child(2){width:220px;height:220px;background:var(--a2);top:-60px;left:-70px;animation-duration:17s;animation-delay:-4s}
.aur i:nth-child(3){width:180px;height:180px;background:var(--a3);top:40px;left:35%;opacity:.45;animation-duration:20s;animation-delay:-8s}
.aur::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(#000,transparent)}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,25px) scale(1.15)}100%{transform:translate(-30px,15px) scale(.95)}}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .in{position:relative;text-align:center;color:#fff}
#splash .lg{width:96px;height:96px;margin:0 auto 14px;animation:pop 1.2s cubic-bezier(.2,.9,.3,1.3) both}
#splash b{font-size:30px;font-weight:700;letter-spacing:.5px;display:block;animation:up .8s .3s both}
#splash span{opacity:.7;font-size:13px;animation:up .8s .45s both;display:block}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes up{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
/* ---------- layout ---------- */
.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:20;color:#fff;margin:0 -16px 18px;padding:calc(12px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 26px 26px;overflow:hidden;box-shadow:0 8px 30px rgba(11,16,32,.25)}
.hdr .row1{position:relative;display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.hdr .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hdr .brand img,.hdr .brand svg{width:34px;height:34px;border-radius:10px}
.hdr .brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .brand small{display:block;font-size:11.5px;opacity:.7;font-weight:500}
.hdr h1{position:relative;margin:14px auto 0;max-width:620px;font-size:22px;font-weight:700;line-height:1.35}
.hdr .sub{position:relative;max-width:620px;margin:2px auto 0;font-size:13px;opacity:.75}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);position:relative}
.ib svg{width:20px;height:20px}.ib:active{transform:scale(.94)}
.ib .bdg{position:absolute;top:-4px;left:-4px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.ct h2,.ct h3{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ct h2 svg{width:19px;height:19px;color:var(--pr)}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12.5px}.xs{font-size:11.5px}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;box-shadow:var(--sh);min-width:0}
.stat b{display:block;font-size:21px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:12px;color:var(--mut)}
.stat i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-bottom:8px;background:var(--prs);color:var(--pr)}.stat i svg{width:17px;height:17px}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}.wrn{color:var(--warn)!important}
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));box-shadow:0 14px 40px var(--prsh)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-90px;left:-60px}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-70px;right:-30px}
.hero>*{position:relative}.hero .mut{color:rgba(255,255,255,.78)}
.hero .big{font-size:30px;font-weight:700;letter-spacing:.3px;direction:ltr;text-align:right}
/* ---------- clock ---------- */
.clock{font-size:52px;font-weight:700;text-align:center;direction:ltr;letter-spacing:1px;line-height:1.05;font-variant-numeric:tabular-nums}
.ring{width:210px;height:210px;margin:4px auto 6px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .clock{font-size:40px}
/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--prs);color:var(--pr);white-space:nowrap}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.bad{background:var(--bads);color:var(--bad)}.chip.warn{background:var(--warns);color:var(--warn)}.chip.mu{background:var(--card2);color:var(--mut);border:1px solid var(--bd)}.chip.teal{background:var(--teals);color:var(--teal)}
[data-theme=dark] .chip:not(.ok):not(.bad):not(.warn):not(.mu):not(.teal){color:var(--pr2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--tx2)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fchip b{opacity:.6;margin-inline-start:4px}
/* ---------- buttons ---------- */
.btn{text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;padding:13px 16px;font-weight:600;font-size:15px;cursor:pointer;width:100%;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 6px 18px var(--prsh);transition:transform .1s,opacity .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 6px 18px rgba(5,150,105,.28)}
.btn.bad{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 18px rgba(225,29,72,.28)}
.btn.gh{background:var(--prs);color:var(--pr);box-shadow:none}
.btn.ln{background:transparent;border:1px solid var(--bd2);color:var(--tx);box-shadow:none}
.btn.dk{background:var(--tx);color:var(--bg);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px;width:auto}
.btn svg{width:19px;height:19px}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.punch .btn{padding:17px;font-size:16px;border-radius:18px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--sh);color:var(--tx2)}
.qa button i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--prs);color:var(--pr)}.qa button i svg{width:20px;height:20px}
.fab{position:fixed;left:18px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:20px;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 12px 30px var(--prsh);cursor:pointer}
.fab svg{width:26px;height:26px}.fab:active{transform:scale(.93)}
/* ---------- inputs ---------- */
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 0 6px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd2);background:var(--card2);color:var(--tx);outline:none;margin-bottom:12px;transition:border .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 50%,13px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:32px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 4px var(--prs)}
input[type=date],input[type=month]{min-height:46px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.amt{position:relative}.amt input{padding-left:50px;direction:ltr;text-align:right;font-weight:600}
.amt button{position:absolute;left:6px;top:6px;width:36px;height:34px;border:0;border-radius:10px;background:var(--prs);color:var(--pr);display:grid;place-items:center;cursor:pointer}.amt button svg{width:18px;height:18px}
.seg{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}.tgl:last-child{border-bottom:0}
.tgl .x{flex:1}.tgl b{display:block;font-weight:600}.tgl span{font-size:12.5px;color:var(--mut)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--bd2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on .sw{background:var(--ok)}.tgl.on .sw::after{transform:translateX(-18px)}
/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0;padding-bottom:0}.li:first-child{padding-top:0}
.li.tap{cursor:pointer}.li .x{flex:1;min-width:0}.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .d{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .n{font-weight:700;white-space:nowrap;text-align:left;direction:ltr}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;flex:none;color:#fff;font-size:16px}
.dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--prs);color:var(--pr)}
.dot svg{width:19px;height:19px}
.dot.ok{background:var(--oks);color:var(--ok)}.dot.bad{background:var(--bads);color:var(--bad)}.dot.warn{background:var(--warns);color:var(--warn)}.dot.mu{background:var(--card2);color:var(--mut)}.dot.teal{background:var(--teals);color:var(--teal)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty svg{width:42px;height:42px;opacity:.35;display:block;margin:0 auto 8px}
.tw{overflow-x:auto;margin:0 -4px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd)}
td{padding:10px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.mp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mp b{font-weight:700}.mp button{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer}.mp button svg{width:18px;height:18px}.mp button:disabled{opacity:.35}
/* wallets */
.wl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x mandatory}.wl::-webkit-scrollbar{display:none}
.wc{min-width:160px;flex:none;border-radius:18px;padding:14px;color:#fff;scroll-snap-align:start;position:relative;overflow:hidden;cursor:pointer}
.wc::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);top:-40px;left:-30px}
.wc b{display:block;font-size:19px;font-weight:700;margin-top:10px;direction:ltr;text-align:right}.wc span{font-size:12.5px;opacity:.85}
/* ---------- nav ---------- */
.nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:600px;margin:0 auto;z-index:30;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:0 12px 40px rgba(15,20,38,.14)}
.nav .in{max-width:620px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;position:relative}
.nav button i{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--pr)}.nav button.on i{background:var(--prs)}
[data-theme=dark] .nav button.on{color:var(--pr2)}
.bdg{position:absolute;top:0;left:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
/* ---------- login ---------- */
#vLogin{position:fixed;inset:0;overflow:auto;z-index:40}
#vLogin .box{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;max-width:430px;margin:0 auto}
#vLogin .lg{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 12px 30px rgba(91,75,255,.55))}
#vLogin h1{color:#fff;text-align:center;margin:0;font-size:28px;font-weight:700}
#vLogin .tag{color:rgba(255,255,255,.7);text-align:center;margin:6px 0 26px}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:20px}
.glass label{color:rgba(255,255,255,.7)}.glass input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}.glass input::placeholder{color:rgba(255,255,255,.4)}
.glass input:focus{box-shadow:0 0 0 4px rgba(124,108,246,.3)}
.pw{position:relative}.pw button{position:absolute;left:8px;top:9px;border:0;background:none;color:rgba(255,255,255,.6);padding:4px;cursor:pointer}
.lnk{background:none;border:0;color:rgba(255,255,255,.8);font-weight:600;cursor:pointer;margin:16px auto 0;display:block;font-size:14px}
/* ---------- sheet / modal ---------- */

function calcEval(s){s=AD(s).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");let i=0;

 ${i.note?`<p>${esc(i.note)}</p>`:""}<p class="pf">شكراً لتعاملكم معنا</p></div>`)}

 <button class="btn" id="pGo">حفظ</button>${p?`<button class="btn ln" id="pDel" style="margin-top:8px;color:var(--bad)">${ic("trash")} حذف الصنف</button>`:""}`);

  await accLoad(true);closeSheet();toast(sizes.length>1?`اتضاف ${sizes.length} أصناف ✓`:"اتحفظ ✓","ok");if(view==="acc")accView()});

async function partySheet(name){sheet(skel(3));let L;try{L=await A("att2_acc_party",{p_party:name})}catch(e){return closeSheet(),toast(e.message,"bad")}
 const eff={sale:1,sret:-1,bill:-1,pret:1,income:-1,expense:1};
 L=[...L].sort((a,b)=>b.day.localeCompare(a.day)||b.id-a.id);let run=0;const rows=[...L].reverse().map(t=>{run+=(eff[t.type]||0)*t.amount;return{t,run}}).reverse();
 const bal=run,ph=((CL.list||[]).find(c=>c.name===name)||{}).phone;
 sheet(`<div class="li" style="padding-bottom:14px"><div class="av" style="${avc(name)}">${esc(ini(name))}</div><div class="x"><div class="t" style="font-size:17px">${esc(name)}</div><div class="d">كشف حساب</div></div>${ph?`<a class="btn gh sm" href="tel:${esc(ph)}">${ic("phone",16)}</a>`:""}</div>

 <div class="row" style="margin-bottom:12px"><button class="btn ok" id="psIn">${ic("up")} تحصيل</button><button class="btn gh" id="psSale">${ic("rcpt")} فاتورة</button><button class="btn ln" id="psOut">${ic("down")} دفع</button></div>
 <div class="tw"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>
 ${rows.map(({t,run})=>{const deb=(eff[t.type]||0)>0,v=fmt2(t.amount);return`<tr class="${t.ref&&/^inv/.test(t.ref)?"tap":""}" data-iref="${t.ref&&/^inv/.test(t.ref)?t.ref.split(":")[1]:""}"><td>${dayShort(t.day)}</td><td style="white-space:normal">${esc(t.note||(TXT[t.type]||[""])[0])}</td><td>${deb?v:""}</td><td>${deb?"":v}</td><td style="direction:ltr;text-align:right">${fmt2(run)}</td></tr>`}).join("")||'<tr><td colspan="5" class="empty">مفيش حركات</td></tr>'}
 </tbody></table></div><div class="row" style="margin-top:12px"><button class="btn gh" id="psPr">${ic("print")} طباعة الكشف</button><button class="btn ln" onclick="closeSheet()">قفل</button></div>`);
 qa("[data-iref]").forEach(r=>{if(r.dataset.iref)r.onclick=()=>invView(+r.dataset.iref)});
 const sup=L.some(t=>t.type==="bill"||t.type==="pret");
 $("psIn").onclick=()=>txSheet(null,{type:"income",party:name,amount:bal>0?bal:""});$("psSale").onclick=()=>invSheet(sup?"purchase":"sale",{party:name});$("psOut").onclick=()=>txSheet(null,{type:"expense",party:name,amount:bal<0?-bal:""});
 $("psPr").onclick=()=>printHtml(`<div class="pinv"><div class="ph"><div><h1>${esc(S.biz||"دوام")}</h1><div>كشف حساب: ${esc(name)}</div></div></div>`+$("sheet").querySelector(".tw").outerHTML+`<p><b>الرصيد: ${fmt2(Math.abs(bal))} ج ${bal>=0?"(مستحق علي العميل)":"(مستحق له)"}</b></p></div>`)}

function md(s){const L=esc(s).split(/\n/);let h="",inL=false;
 for(let l of L){const b=/^\s*(?:[-•*]|\d+[.)])\s+(.*)/.exec(l);l=(b?b[1]:l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s*(.+)/,"<b>$1</b>");
  if(b){if(!inL){h+="<ul>";inL=true}h+=`<li>${l}</li>`}else{if(inL){h+="</ul>";inL=false}h+=l.trim()?`<p>${l}</p>`:""}}
 return h+(inL?"</ul>":"")}

 ${d.fb.length?`<div class="card"><div class="ct"><h2>${ic("thumbup")} آراء الفريق</h2></div>${d.fb.map(f=>`<div class="li"><div class="dot ${f.rating>0?"ok":"bad"}" style="width:34px;height:34px">${ic(f.rating>0?"thumbup":"thumbdown",15)}</div><div class="x"><div class="t">${esc(f.owner)}</div><div class="d" style="white-space:normal">${esc(f.feedback||String(f.content).slice(0,90))}</div></div></div>`).join("")}</div>`:""}
 ${d.usage.length?`<div class="card"><div class="ct"><h2>${ic("chart")} الاستخدام (آخر 30 يوم)</h2></div>${d.usage.map(u=>`<div class="li"><div class="x"><div class="t">${esc(u.owner)}</div></div><div class="n">${u.n} رسالة</div></div>`).join("")}</div>`:""}
 <button class="btn" id="aiTry">${ic("spark")} جرّب ستايلي</button>`);
 if($("aiSetup"))$("aiSetup").onclick=aiSetupSheet;$("aiTry").onclick=aiOpen;
 $("aiAll").onclick=()=>busy(null,async()=>{await A("att2_admin_ai_settings",{p_all:!d.ai_all,p_daily:null});aiAdmView()});
 $("aiDailyGo").onclick=()=>busy($("aiDailyGo"),async()=>{await A("att2_admin_ai_settings",{p_all:null,p_daily:+AD($("aiDaily").value)});toast("اتحفظ ✓","ok")});
 const kb=k=>{sheet(`<h2>${k?"تعديل معلومة":"معلومة جديدة"}</h2><label>العنوان</label><input id="kbT" value="${esc(k?k.title:"")}"><label>المعلومة</label><textarea id="kbB" rows="5">${esc(k?k.body:"")}</textarea><button class="btn" id="kbGo">حفظ</button>${k&&k.id?`<button class="btn ln" id="kbDel" style="margin-top:8px;color:var(--bad)">${ic("trash")} حذف</button>`:""}`);
  $("kbGo").onclick=()=>busy($("kbGo"),async()=>{await A("att2_admin_ai_kb_save",{p_id:k&&k.id||null,p_title:$("kbT").value,p_body:$("kbB").value});closeSheet();aiAdmView()});
  if($("kbDel"))$("kbDel").onclick=()=>busy($("kbDel"),async()=>{await A("att2_admin_ai_kb_del",{p_id:k.id});closeSheet();aiAdmView()})};
 $("kbAdd").onclick=()=>kb(null);qa("[data-kb]").forEach(r=>r.onclick=()=>kb(d.kb.find(x=>x.id==r.dataset.kb)));
 qa("[data-tpl]").forEach(b=>b.onclick=()=>kb({title:b.dataset.tpl,body:b.dataset.b}));
 qa("[data-md]").forEach(b=>b.onclick=()=>busy(b,async()=>{await A("att2_admin_ai_mem_del",{p_id:+b.dataset.md});aiAdmView()}));
 qa("[data-mpr]").forEach(b=>b.onclick=()=>busy(b,async()=>{await A("att2_admin_ai_mem_promote",{p_id:+b.dataset.mpr});toast("بقت معلومة للمحل كله ✓","ok");aiAdmView()}))}
function aiSetupSheet(){sheet(`<h2>${ic("spark",22)} تفعيل ستايلي</h2><p class="lead">مرة واحدة بس، حوالي 5 دقايق.</p><div class="steps">
 <div class="li"><div class="dot">1</div><div class="x"><b>مفتاح الذكاء الاصطناعي</b><div class="d" style="white-space:normal">ادخل console.anthropic.com واعمل حساب، اشحن رصيد (5$ بتكفي آلاف الرسايل)، ومن API Keys اعمل مفتاح جديد وانسخه.</div></div></div>
 <div class="li"><div class="dot">2</div><div class="x"><b>اعمل الـ Function</b><div class="d" style="white-space:normal">في Supabase: Edge Functions ← Deploy a new function ← Via Editor. سمّيها <b>dawam-ai</b> بالظبط، والصق كود ملف dawam-ai.ts كله، ودوس Deploy.</div></div></div>
 <div class="li"><div class="dot">3</div><div class="x"><b>اقفل التحقق</b><div class="d" style="white-space:normal">من إعدادات الـ function اقفل «Verify JWT / Enforce JWT verification» (التطبيق بيتحقق بنفسه).</div></div></div>
 <div class="li"><div class="dot">4</div><div class="x"><b>حط المفتاح</b><div class="d" style="white-space:normal">Edge Functions ← Secrets ← Add: الاسم <b>ANTHROPIC_API_KEY</b> والقيمة المفتاح اللي نسخته.</div></div></div></div>
 <button class="btn" onclick="closeSheet();aiAdmView()">خلصت — اتأكد</button>`)}

/* ======================== المظهر ======================== */
const THEME={mode:LS.get("dw_mode","auto"),accent:LS.get("dw_acc","indigo"),fs:LS.get("dw_fs","md")};
const ACCENTS=[["indigo","بنفسجي","#4f46e5"],["gold","ذهبي فخم","#b8862f"],["emerald","زمردي","#059669"],["ocean","أزرق","#0284c7"],["rose","وردي","#db2777"],["noir","أسود","#18181b"]];
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(){const r=document.documentElement,dark=THEME.mode==="dark"||(THEME.mode==="auto"&&mq.matches);r.dataset.theme=dark?"dark":"light";r.dataset.accent=THEME.accent;r.dataset.fs=THEME.fs;
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#0a0e1a":"#0b1020"}
mq.addEventListener&&mq.addEventListener("change",applyTheme);applyTheme();
function themeCard(){return`<div class="card"><div class="ct"><h2>${ic("palette")} المظهر</h2></div>
 <label>الوضع</label><div class="seg" id="thM">${[["auto","تلقائي"],["light","☀️ فاتح"],["dark","🌙 داكن"]].map(([k,t])=>`<button data-m="${k}" class="${THEME.mode===k?"on":""}">${t}</button>`).join("")}</div>
 <label>اللون</label><div class="sws">${ACCENTS.map(([k,t,c])=>`<button class="swatch ${THEME.accent===k?"on":""}" data-a="${k}" style="--c:${c}" aria-label="${t}"><i></i><span>${t}</span></button>`).join("")}</div>
 <label style="margin-top:12px">حجم الكلام</label><div class="seg" id="thF">${[["md","عادي"],["lg","كبير"]].map(([k,t])=>`<button data-f="${k}" class="${THEME.fs===k?"on":""}">${t}</button>`).join("")}</div></div>`}
function bindTheme(){qa("#thM button").forEach(b=>b.onclick=()=>{THEME.mode=b.dataset.m;LS.set("dw_mode",THEME.mode);applyTheme();setView()});
 qa("[data-a]").forEach(b=>b.onclick=()=>{THEME.accent=b.dataset.a;LS.set("dw_acc",THEME.accent);applyTheme();sfx.pop();setView()});
 qa("#thF button").forEach(b=>b.onclick=()=>{THEME.fs=b.dataset.f;LS.set("dw_fs",THEME.fs);applyTheme();setView()})}

/* ======================== الإيماءات ======================== */
// اسحب أي نافذة لتحت علشان تقفلها
function sheetCloser(id){if(id==="ovSheet")return()=>{if(sheetLocked)return false;closeSheet();return true};if(id==="ovAsk")return()=>{if(askDone)askDone(false);else closeOv(id);return true};return()=>{closeOv(id);return true}}
["ovSheet","ovCalc","ovAsk"].forEach(id=>{const ov=$(id),sh=ov.querySelector(".sheet");let st=null;
 sh.addEventListener("touchstart",e=>{if(e.touches.length>1)return;const onGrip=e.target.closest(".grip");if(sh.scrollTop>2&&!onGrip)return;if(!onGrip&&e.target.closest("textarea,.wl,.chips,.tw,.seg"))return;st={y:e.touches[0].clientY,x:e.touches[0].clientX,t:Date.now(),dy:0,lock:null}},{passive:true});
 sh.addEventListener("touchmove",e=>{if(!st)return;const dy=e.touches[0].clientY-st.y,dx=e.touches[0].clientX-st.x;
  if(!st.lock){if(Math.abs(dy)<8&&Math.abs(dx)<8)return;st.lock=dy>0&&Math.abs(dy)>Math.abs(dx)?"v":"n"}
  if(st.lock!=="v"||(sh.scrollTop>2))return;e.preventDefault();st.dy=Math.max(0,dy);sh.style.transition="none";sh.style.transform=`translateY(${st.dy}px)`;ov.style.background=`rgba(6,9,20,${.55*Math.max(0,1-st.dy/500)})`},{passive:false});
 const end=()=>{if(!st)return;const v=st.dy/Math.max(1,Date.now()-st.t),go=st.dy>110||(st.dy>40&&v>.6);sh.style.transition="";ov.style.background="";
  if(go&&sheetCloser(id)()){vib(8);setTimeout(()=>sh.style.transform="",300)}else sh.style.transform="";st=null};
 sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end)});
// اسحب من حافة الشاشة علشان ترجع (الشات والمساعد)
[["conv",()=>closeConv()],["aiv",()=>aiClose()]].forEach(([id,fn])=>{const el=$(id);let st=null;
 el.addEventListener("touchstart",e=>{const x=e.touches[0].clientX;if(x<28||x>innerWidth-28||e.target.closest(".ch"))st={x,y:e.touches[0].clientY,edge:x<28?1:x>innerWidth-28?-1:0};else st=null},{passive:true});
 el.addEventListener("touchmove",e=>{if(!st)return;const dx=e.touches[0].clientX-st.x,dy=e.touches[0].clientY-st.y;
  if(st.edge&&dx*st.edge>0&&Math.abs(dx)>Math.abs(dy)){el.style.transition="none";el.style.transform=`translateX(${dx}px)`;st.dx=dx}
  else if(!st.edge&&dy>0&&Math.abs(dy)>Math.abs(dx)){el.style.transition="none";el.style.transform=`translateY(${dy}px)`;st.dy=dy}},{passive:true});
 el.addEventListener("touchend",()=>{if(!st)return;el.style.transition="";const ok=Math.abs(st.dx||0)>90||(st.dy||0)>120;el.style.transform="";if(ok){vib(8);fn()}st=null})});
// اسحب الصفحة لتحت علشان تحدّث
(function(){let st=null;const ind=$("ptr");
 document.addEventListener("touchstart",e=>{if(scrollY>0||qa(".ov.show").length||CV.open||AI.open||$("vApp").classList.contains("hide"))return st=null;if(!e.target.closest("#views,.hdr"))return st=null;st={y:e.touches[0].clientY,dy:0}},{passive:true});
 document.addEventListener("touchmove",e=>{if(!st)return;st.dy=e.touches[0].clientY-st.y;if(st.dy<=0||scrollY>0){ind.style.transform="";return}const d=Math.min(110,st.dy*.5);ind.style.transform=`translateY(${d}px) rotate(${d*3}deg)`;ind.classList.toggle("ready",d>=60)},{passive:true});
 document.addEventListener("touchend",async()=>{if(!st)return;const go=st.dy*.5>=60;st=null;if(!go){ind.style.transform="";ind.classList.remove("ready");return}
  ind.classList.add("spin2");ind.style.transform="translateY(60px)";vib(10);try{await refreshAll(false)}finally{ind.classList.remove("spin2","ready");ind.style.transform=""}})})();

/* ======================== التحديث اللحظي ======================== */
let RT=null,RTc=null;const RF={busy:false,pending:false,t:null};
const READ_RE=/^(att2_login|att_my_month|att2_emp_extra|att_admin_report|att2_admin_extra|att2_acc_data|att2_acc_party|att2_acc_day|att2_acc_inv_get|att2_acc_prod_moves|att2_acc_audit|att_chat_summary|att_emp_names|att_chat_page|att_chat_search|att_cl_list|att_cl_get|att2_ai_|att2_admin_ai$|att2_admin_complaints|att2_recover)/;
function rtStart(){if(RT||!window.supabase)return;try{RTc=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
 RT=RTc.channel("dawam-live",{config:{broadcast:{self:false}}});RT.on("broadcast",{event:"chg"},({payload})=>onRemote(payload||{})).subscribe()}catch(e){RT=null}}
function notifyChange(fn){if(!RT)return;try{RT.send({type:"broadcast",event:"chg",payload:{t:fn,by:S.role?who().n:""}})}catch(e){}}
function onRemote(p){if(!S.role)return;const t=p.t||"";
 if(/chat/.test(t)){if(CV.open)convPoll();pollSummary();if(view==="chat")setTimeout(refreshPreviews,400);return}
 if(isAdmin()&&/emp_(permit|excuse|complaint|req_adv)/.test(t)){sfx.recv();toast(/permit/.test(t)?"🚪 "+(p.by||"موظف")+" عمل إذن خروج":/excuse/.test(t)?"📄 عذر جديد من "+(p.by||"موظف"):/complaint/.test(t)?"📣 شكوى جديدة":"💸 طلب سلفة جديد")}
 if(!isAdmin()&&/admin_announce$/.test(t)){sfx.recv();toast("📢 إعلان جديد من الإدارة")}
 clearTimeout(RF.t);RF.t=setTimeout(()=>refreshAll(true),600)}
async function refreshAll(silent){if(!S.role||RF.busy)return;
 const typing=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#views")&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
 if(silent&&(qa(".ov.show").length||typing)){RF.pending=true;return}
 RF.busy=true;RF.pending=false;
 try{if(isAdmin())await admLoad();else{await empLoad();if(R)await admLoad()}
  if(ACC.d&&(view==="acc"||view==="home"))await accLoad(true);
  if(view==="clients")await clLoad();if(view==="req")RQ.cmp=null;
  updBadges();pollSummary();
  const y=scrollY;if(view==="chat"){chatListRender();refreshPreviews()}else if(RENDER[view]&&view!=="ai"&&view!=="prof"){await RENDER[view]();scrollTo(0,y)}
  if(!silent)toast("اتحدّث ✓","ok")}catch(e){if(!silent)toast(e.message,"bad")}finally{RF.busy=false}}
document.addEventListener("visibilitychange",()=>{if(document.hidden||!S.role)return;refreshAll(true);if(CV.open)convPoll();checkVersion()});

/* ======================== نسخة جديدة ======================== */
async function checkVersion(){try{const t=await (await fetch(location.pathname+"?_v="+Date.now(),{cache:"no-store"})).text();const m=/APP_VER="([^"]+)"/.exec(t);
 if(m&&m[1]!==APP_VER)$("upd").classList.remove("hide")}catch(e){}}
$("upd").onclick=()=>location.reload();setInterval(()=>{if(!document.hidden)checkVersion()},300000);

/* ======================== التشغيل ======================== */
$("ptr").innerHTML=ic("refresh");
(function start(){const go=()=>{const sp=$("splash");sp.classList.add("out");setTimeout(()=>sp.remove(),600)};
 const link=checkRecoveryLink();
 window.addEventListener("load",()=>{if(S.role)rtStart()});
 if(!link&&S.role&&(S.key||S.p))boot().finally(()=>setTimeout(go,300));else{showLogin();setTimeout(go,900)}})();
