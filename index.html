<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دوام">
<title>دوام — إدارة فريقك وحساباتك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f4f5fa;--card:#ffffff;--card2:#f8f9fc;--tx:#0f1426;--tx2:#3b4257;--mut:#7a8199;--bd:#e7e9f2;--bd2:#dfe2ee;
 --pr:#4f46e5;--pr2:#7c6cf6;--prs:#eeedff;--teal:#0ea5a4;--teals:#e3f7f6;
 --ok:#059669;--oks:#e5f7ef;--bad:#e11d48;--bads:#fdebef;--warn:#d97706;--warns:#fff4e3;
 --ink:#0b1020;--sh:0 1px 2px rgba(15,20,38,.04),0 6px 24px rgba(15,20,38,.06);--sh2:0 10px 40px rgba(15,20,38,.16);
 --r:20px;--chatbg:#efeae2;--me:#dcd9ff;--them:#ffffff;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#0a0e1a;--card:#121829;--card2:#0f1424;--tx:#eef0f8;--tx2:#c3c8d9;--mut:#8890a8;--bd:#1f2740;--bd2:#283150;
 --prs:#1e1d4a;--teals:#0d2c2d;--oks:#0c2a20;--bads:#33121c;--warns:#2e2210;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 40px rgba(0,0,0,.5);
 --chatbg:#0c1220;--me:#2f2a7a;--them:#1a2135}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.hide{display:none!important}
button{font:inherit;color:inherit}
a{color:var(--pr)}
svg{flex:none}
/* ---------- aurora ---------- */
.aur{position:absolute;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 120% at 100% 0%,#1b1f4a 0%,#0b1020 55%)}
.aur i{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;mix-blend-mode:screen;animation:fl 14s ease-in-out infinite alternate}
.aur i:nth-child(1){width:260px;height:260px;background:#5b4bff;top:-110px;right:-60px}
.aur i:nth-child(2){width:220px;height:220px;background:#10b4ae;top:-60px;left:-70px;animation-duration:17s;animation-delay:-4s}
.aur i:nth-child(3){width:180px;height:180px;background:#c04bff;top:40px;left:35%;opacity:.45;animation-duration:20s;animation-delay:-8s}
.aur::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(#000,transparent)}
@keyframes fl{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,25px) scale(1.15)}100%{transform:translate(-30px,15px) scale(.95)}}
/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .in{position:relative;text-align:center;color:#fff}
#splash .lg{width:96px;height:96px;margin:0 auto 14px;animation:pop 1.2s cubic-bezier(.2,.9,.3,1.3) both}
#splash b{font-size:30px;font-weight:700;letter-spacing:.5px;display:block;animation:up .8s .3s both}
#splash span{opacity:.7;font-size:13px;animation:up .8s .45s both;display:block}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes up{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
/* ---------- layout ---------- */
.wrap{max-width:620px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:20;color:#fff;margin:0 -16px 18px;padding:calc(12px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 26px 26px;overflow:hidden;box-shadow:0 8px 30px rgba(11,16,32,.25)}
.hdr .row1{position:relative;display:flex;align-items:center;gap:10px;max-width:620px;margin:0 auto}
.hdr .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hdr .brand img,.hdr .brand svg{width:34px;height:34px;border-radius:10px}
.hdr .brand b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .brand small{display:block;font-size:11.5px;opacity:.7;font-weight:500}
.hdr h1{position:relative;margin:14px auto 0;max-width:620px;font-size:22px;font-weight:700;line-height:1.35}
.hdr .sub{position:relative;max-width:620px;margin:2px auto 0;font-size:13px;opacity:.75}
.ib{width:40px;height:40px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);position:relative}
.ib svg{width:20px;height:20px}.ib:active{transform:scale(.94)}
.ib .bdg{position:absolute;top:-4px;left:-4px}
/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.ct h2,.ct h3{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.ct h2 svg{width:19px;height:19px;color:var(--pr)}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12.5px}.xs{font-size:11.5px}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;box-shadow:var(--sh);min-width:0}
.stat b{display:block;font-size:21px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat span{font-size:12px;color:var(--mut)}
.stat i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;margin-bottom:8px;background:var(--prs);color:var(--pr)}.stat i svg{width:17px;height:17px}
.pos{color:var(--ok)!important}.neg{color:var(--bad)!important}.wrn{color:var(--warn)!important}
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#0ea5a4);box-shadow:0 14px 40px rgba(79,70,229,.35)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);top:-90px;left:-60px}
.hero::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-70px;right:-30px}
.hero>*{position:relative}.hero .mut{color:rgba(255,255,255,.78)}
.hero .big{font-size:30px;font-weight:700;letter-spacing:.3px;direction:ltr;text-align:right}
/* ---------- clock ---------- */
.clock{font-size:52px;font-weight:700;text-align:center;direction:ltr;letter-spacing:1px;line-height:1.05;font-variant-numeric:tabular-nums}
.ring{width:210px;height:210px;margin:4px auto 6px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .clock{font-size:40px}
/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--prs);color:var(--pr);white-space:nowrap}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.bad{background:var(--bads);color:var(--bad)}.chip.warn{background:var(--warns);color:var(--warn)}.chip.mu{background:var(--card2);color:var(--mut);border:1px solid var(--bd)}.chip.teal{background:var(--teals);color:var(--teal)}
@media(prefers-color-scheme:dark){.chip{color:#a9a3ff}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--tx2)}
.fchip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fchip b{opacity:.6;margin-inline-start:4px}
/* ---------- buttons ---------- */
.btn{text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:15px;padding:13px 16px;font-weight:600;font-size:15px;cursor:pointer;width:100%;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:0 6px 18px rgba(79,70,229,.28);transition:transform .1s,opacity .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 6px 18px rgba(5,150,105,.28)}
.btn.bad{background:linear-gradient(135deg,#e11d48,#f43f5e);box-shadow:0 6px 18px rgba(225,29,72,.28)}
.btn.gh{background:var(--prs);color:var(--pr);box-shadow:none}
.btn.ln{background:transparent;border:1px solid var(--bd2);color:var(--tx);box-shadow:none}
.btn.dk{background:var(--tx);color:var(--bg);box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px;width:auto}
.btn svg{width:19px;height:19px}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .5s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.punch .btn{padding:17px;font-size:16px;border-radius:18px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--sh);color:var(--tx2)}
.qa button i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--prs);color:var(--pr)}.qa button i svg{width:20px;height:20px}
.fab{position:fixed;left:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:15;width:58px;height:58px;border-radius:20px;border:0;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pr),#7c3aed);box-shadow:0 12px 30px rgba(79,70,229,.45);cursor:pointer}
.fab svg{width:26px;height:26px}.fab:active{transform:scale(.93)}
/* ---------- inputs ---------- */
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:0 0 6px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd2);background:var(--card2);color:var(--tx);outline:none;margin-bottom:12px;transition:border .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:18px 50%,13px 50%;background-size:5px 5px;background-repeat:no-repeat;padding-left:32px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 4px var(--prs)}
input[type=date],input[type=month]{min-height:46px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.amt{position:relative}.amt input{padding-left:50px;direction:ltr;text-align:right;font-weight:600}
.amt button{position:absolute;left:6px;top:6px;width:36px;height:34px;border:0;border-radius:10px;background:var(--prs);color:var(--pr);display:grid;place-items:center;cursor:pointer}.amt button svg{width:18px;height:18px}
.seg{display:flex;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.tgl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}.tgl:last-child{border-bottom:0}
.tgl .x{flex:1}.tgl b{display:block;font-weight:600}.tgl span{font-size:12.5px;color:var(--mut)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--bd2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on .sw{background:var(--ok)}.tgl.on .sw::after{transform:translateX(-18px)}
/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0;padding-bottom:0}.li:first-child{padding-top:0}
.li.tap{cursor:pointer}.li .x{flex:1;min-width:0}.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .d{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .n{font-weight:700;white-space:nowrap;text-align:left;direction:ltr}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;flex:none;color:#fff;font-size:16px}
.dot{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:700;flex:none;background:var(--prs);color:var(--pr)}
.dot svg{width:19px;height:19px}
.dot.ok{background:var(--oks);color:var(--ok)}.dot.bad{background:var(--bads);color:var(--bad)}.dot.warn{background:var(--warns);color:var(--warn)}.dot.mu{background:var(--card2);color:var(--mut)}.dot.teal{background:var(--teals);color:var(--teal)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty svg{width:42px;height:42px;opacity:.35;display:block;margin:0 auto 8px}
.tw{overflow-x:auto;margin:0 -4px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd)}
td{padding:10px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.mp{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mp b{font-weight:700}.mp button{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer}.mp button svg{width:18px;height:18px}.mp button:disabled{opacity:.35}
/* wallets */
.wl{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x mandatory}.wl::-webkit-scrollbar{display:none}
.wc{min-width:160px;flex:none;border-radius:18px;padding:14px;color:#fff;scroll-snap-align:start;position:relative;overflow:hidden;cursor:pointer}
.wc::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);top:-40px;left:-30px}
.wc b{display:block;font-size:19px;font-weight:700;margin-top:10px;direction:ltr;text-align:right}.wc span{font-size:12.5px;opacity:.85}
/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:620px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--mut);font-size:11px;font-weight:600;cursor:pointer;position:relative}
.nav button i{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--pr)}.nav button.on i{background:var(--prs)}
@media(prefers-color-scheme:dark){.nav button.on{color:#a9a3ff}}
.bdg{position:absolute;top:0;left:calc(50% - 22px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
/* ---------- login ---------- */
#vLogin{position:fixed;inset:0;overflow:auto;z-index:40}
#vLogin .box{position:relative;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 22px 30px;max-width:430px;margin:0 auto}
#vLogin .lg{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 12px 30px rgba(91,75,255,.55))}
#vLogin h1{color:#fff;text-align:center;margin:0;font-size:28px;font-weight:700}
#vLogin .tag{color:rgba(255,255,255,.7);text-align:center;margin:6px 0 26px}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:24px;padding:20px}
.glass label{color:rgba(255,255,255,.7)}.glass input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#fff}.glass input::placeholder{color:rgba(255,255,255,.4)}
.glass input:focus{box-shadow:0 0 0 4px rgba(124,108,246,.3)}
.pw{position:relative}.pw button{position:absolute;left:8px;top:9px;border:0;background:none;color:rgba(255,255,255,.6);padding:4px;cursor:pointer}
.lnk{background:none;border:0;color:rgba(255,255,255,.8);font-weight:600;cursor:pointer;margin:16px auto 0;display:block;font-size:14px}
/* ---------- sheet / modal ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,20,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.ov.show{opacity:1}
.sheet{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.ov.show .sheet{transform:none}
.grip{width:42px;height:5px;border-radius:3px;background:var(--bd2);margin:2px auto 14px}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:700}.sheet .lead{color:var(--mut);font-size:13.5px;margin:0 0 16px}
#ovCalc{z-index:80}#ovAsk{z-index:90}#ovAsk .sheet{text-align:center}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu button{border:1px solid var(--bd);background:var(--card2);border-radius:18px;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12.5px;cursor:pointer;position:relative;color:var(--tx2)}
.menu button i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff}.menu button i svg{width:22px;height:22px}
.menu .bdg{top:8px;left:12px}
/* ---------- calculator ---------- */
.cal-d{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;direction:ltr;text-align:right;min-height:96px}
.cal-d .e{color:var(--mut);font-size:16px;min-height:22px;word-break:break-all}
.cal-d .r{font-size:38px;font-weight:700;word-break:break-all;line-height:1.2}
.cal-k{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;direction:ltr}
.cal-k button{height:58px;border-radius:18px;border:0;background:var(--card2);font-size:22px;font-weight:600;cursor:pointer;color:var(--tx)}
.cal-k button:active{transform:scale(.95)}
.cal-k .op{background:var(--prs);color:var(--pr)}.cal-k .eq{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff}.cal-k .fn{color:var(--bad)}
.cal-h{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;direction:ltr;scrollbar-width:none}
.cal-h button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:5px 10px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--tx2)}
/* ---------- toast ---------- */
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}

function bubble(m,prevM){const me=who().n,mine=m.sender===me,u=safeUrl(m.file_url),grp=CV.with==="",gap=!prevM||prevM.sender!==m.sender;
 let h=`<div class="mrow ${mine?"me":"them"} ${gap?"gap":""}" id="m${m.id}" data-id="${m.id}"><div class="sw-i">${ic("reply")}</div><div class="bub">`;
 if(grp&&!mine&&gap)h+=`<div class="snd" style="color:${nameColor(m.sender)}">${esc(m.sender)}${m.sender===MGR?" ⭐":""}</div>`;
 if(m.reply_to)h+=`<div class="q" data-jump="${m.reply_to}"><b>${esc(m.reply_sender===me?"أنت":m.reply_sender||"")}</b>${esc(m.reply_text||"رسالة")}</div>`;
 if(m.kind==="image"&&u)h+=`<img class="mi" loading="lazy" src="${esc(u)}" data-img="${esc(u)}" alt="">`;
 else if(m.kind==="voice"&&u){let seed=m.id;const bars=Array.from({length:28},()=>{seed=(seed*9301+49297)%233280;return 25+Math.round(seed/233280*75)});
  h+=`<div class="vp" data-src="${esc(u)}" data-dur="${m.file_dur||m.dur||""}"><button data-play>${ic("play")}</button><div class="wv">${bars.map(b=>`<s style="height:${b}%"></s>`).join("")}</div><em>${m.file_dur||m.dur?durTxt(m.file_dur||m.dur):"0:00"}</em></div>`}
 else if(m.kind==="file"&&u){const ext=((m.file_name||"").split(".").pop()||"FILE").slice(0,4).toUpperCase();h+=`<a class="fl" href="${esc(u)}" target="_blank" rel="noopener"><i>${esc(ext)}</i><div style="min-width:0"><b>${esc(m.file_name||"ملف")}</b><span class="mut xs">${fmtSize(m.file_size)}</span></div></a>`}
 if(m.body)h+=`<span class="txt">${linkify(esc(m.body))}</span>`;
 h+=`<span class="meta">${esc(m.ts||"")}${mine?" ✓":""}</span></div></div>`;return h}
const linkify=s=>s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const fmtSize=n=>!n?"":n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const durTxt=s=>{s=Math.round(+s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let MS=[];
function drawMsgs(rs,where){rs=rs.filter(m=>!CV.ids.has(m.id));if(!rs.length)return 0;const box=$("msgs");box.querySelector(".ph")?.remove();
 rs.forEach(m=>CV.ids.add(m.id));
 if(where==="start"){MS=[...rs,...MS];const pv=box.scrollHeight;box.innerHTML=MS.map((m,i)=>bubble(m,MS[i-1])).join("");box.scrollTop=box.scrollHeight-pv}
 else{const last=MS[MS.length-1];MS=MS.concat(rs);box.insertAdjacentHTML("beforeend",rs.map((m,i)=>bubble(m,i?rs[i-1]:last)).join(""))}
 rs.forEach(m=>{CV.oldest=CV.oldest?Math.min(CV.oldest,m.id):m.id;CV.last=Math.max(CV.last,m.id)});return rs.length}
async function convReset(dir,id){const my=++CV.ver;CV.busy=true;CV.jumped=dir==="around";CV.ids=new Set();MS=[];CV.last=CV.oldest=0;CV.more=true;
 const box=$("msgs");box.innerHTML='<div class="ph" style="text-align:center;margin-top:40px"><span class="spin" style="display:inline-block;border-color:var(--bd2);border-top-color:var(--pr)"></span></div>';
 try{const rs=await page(dir,id);if(my!==CV.ver)return;box.innerHTML="";drawMsgs(rs,"end");CV.more=rs.length>=(dir==="latest"?40:1);
  if(!rs.length)box.innerHTML=`<div class="ph" style="text-align:center;margin-top:60px"><span class="dsep"><span>مفيش رسايل لسه — قول أهلاً 👋</span></span></div>`;
  if(dir==="around"){const el=$("m"+id);if(el){el.scrollIntoView({block:"center"});el.classList.add("hl")}}else box.scrollTop=box.scrollHeight;
  if(!CV.jumped&&CV.last){SEEN[CV.with]=Math.max(SEEN[CV.with]||0,CV.last);saveSeen()}}catch(e){box.innerHTML=`<div class="ph empty">${esc(e.message)}</div>`}CV.busy=false}
async function convPoll(){if(!CV.open||CV.busy||CV.jumped)return;const my=CV.ver;
 try{const rs=await page("new",CV.last||0);if(my!==CV.ver||!rs.length)return;const box=$("msgs"),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  const theirs=rs.some(m=>m.sender!==who().n);if(drawMsgs(rs,"end")){if(atEnd)box.scrollTo({top:box.scrollHeight,behavior:"smooth"});if(theirs)sfx.pop();SEEN[CV.with]=Math.max(SEEN[CV.with]||0,CV.last);saveSeen()}}catch(e){}}
$("msgs").addEventListener("scroll",async()=>{const box=$("msgs");if(box.scrollTop<60&&CV.more&&!CV.busy&&CV.oldest){CV.busy=true;const my=CV.ver;try{const rs=await page("older",CV.oldest);if(my===CV.ver){if(!drawMsgs(rs,"start")||rs.length<40)CV.more=false}}catch(e){}CV.busy=false}
 if(CV.jumped&&box.scrollHeight-box.scrollTop-box.clientHeight<40&&!CV.busy){CV.busy=true;try{const rs=await page("new",CV.last);if(rs.length)drawMsgs(rs,"end");else CV.jumped=false}catch(e){}CV.busy=false}},{passive:true});

 box.addEventListener("touchstart",e=>{const row=e.target.closest(".mrow");if(!row)return;const t=e.touches[0];st={row,x:t.clientX,y:t.clientY,dx:0,lock:null,lp:setTimeout(()=>{if(st&&!st.lock){st.lock="lp";vib(15);msgMenu(msgById(row.dataset.id))}},520)}},{passive:true});
 box.addEventListener("touchmove",e=>{if(!st)return;const t=e.touches[0],dx=t.clientX-st.x,dy=t.clientY-st.y;
  if(!st.lock){if(Math.abs(dx)>10||Math.abs(dy)>10){clearTimeout(st.lp);st.lock=Math.abs(dx)>Math.abs(dy)*1.3?"h":"v"}}
  if(st.lock==="h"){e.preventDefault();const sg=st.row.classList.contains("them")?-1:1;st.dx=sg*Math.max(0,Math.min(90,sg*dx));const b=st.row.querySelector(".bub"),i=st.row.querySelector(".sw-i");b.style.transition="none";b.style.transform=`translateX(${st.dx}px)`;i.style.opacity=Math.min(1,Math.abs(st.dx)/60);
   i.style.transform=`scale(${Math.min(1,Math.abs(st.dx)/60)})`;if(Math.abs(st.dx)>=60&&!st.hit){st.hit=1;vib(12);sfx.tap()}}},{passive:false});
 const end=()=>{if(!st)return;clearTimeout(st.lp);const b=st.row.querySelector(".bub"),i=st.row.querySelector(".sw-i");b.style.transition="";b.style.transform="";i.style.opacity=0;i.style.transform="";
  if(st.lock==="h"&&Math.abs(st.dx)>=60)setReply(msgById(st.row.dataset.id));st=null};
 box.addEventListener("touchend",end);box.addEventListener("touchcancel",end);
 box.addEventListener("dblclick",e=>{const row=e.target.closest(".mrow");if(row)setReply(msgById(row.dataset.id))});
 box.addEventListener("contextmenu",e=>{const row=e.target.closest(".mrow");if(row){e.preventDefault();msgMenu(msgById(row.dataset.id))}});
 box.addEventListener("click",e=>{const q=e.target.closest("[data-jump]");if(q){const el=$("m"+q.dataset.jump);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.remove("hl");void el.offsetWidth;el.classList.add("hl")}else convReset("around",+q.dataset.jump);return}
  const im=e.target.closest("[data-img]");if(im)return lightbox(im.dataset.img);
  const pl=e.target.closest("[data-play]");if(pl)return playVoice(pl.closest(".vp"));
  const wv=e.target.closest(".wv");if(wv){const vp=wv.closest(".vp");if(AU.vp===vp&&AU.a.duration){const r=wv.getBoundingClientRect();AU.a.currentTime=AU.a.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}}})})();

 <button id="mmR"><i style="background:#4f46e5">${ic("reply")}</i>رد</button>${m.body?`<button id="mmC"><i style="background:#0ea5a4">${ic("copy")}</i>نسخ</button>`:""}${safeUrl(m.file_url)?`<button id="mmO"><i style="background:#db2777">${ic("download")}</i>فتح / تحميل</button>`:""}</div>`);

const AU={a:new Audio(),vp:null};AU.a.preload="none";
function playVoice(vp){if(AU.vp===vp){if(AU.a.paused)AU.a.play();else AU.a.pause();return}
 if(AU.vp)resetVp(AU.vp);AU.vp=vp;AU.a.src=vp.dataset.src;AU.a.play().catch(()=>toast("مش قادر يشغّل التسجيل","bad"))}
function resetVp(vp){vp.querySelector("[data-play]").innerHTML=ic("play");qa("s",vp).forEach(s=>s.classList.remove("on"))}
AU.a.onplay=()=>{if(AU.vp)AU.vp.querySelector("[data-play]").innerHTML=ic("pause")};AU.a.onpause=()=>{if(AU.vp)AU.vp.querySelector("[data-play]").innerHTML=ic("play")};
AU.a.ontimeupdate=()=>{const vp=AU.vp;if(!vp||!AU.a.duration||!isFinite(AU.a.duration))return;const p=AU.a.currentTime/AU.a.duration,bs=qa("s",vp);bs.forEach((s,i)=>s.classList.toggle("on",i/bs.length<=p));vp.querySelector("em").textContent=durTxt(AU.a.currentTime)};
AU.a.onended=()=>{if(AU.vp){resetVp(AU.vp);AU.vp.querySelector("em").textContent=durTxt(AU.a.duration)}AU.vp=null};

const REC={on:false,r:null,chunks:[],t0:0,tm:null,cancel:false,st:null};goIcon();
async function recStart(){if(!navigator.mediaDevices||!window.MediaRecorder)return toast("المتصفح ده مش بيدعم التسجيل الصوتي","bad");
 try{REC.st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast("اسمح للمتصفح يستخدم الميكروفون","bad")}
 const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
 REC.chunks=[];REC.cancel=false;REC.r=new MediaRecorder(REC.st,mime?{mimeType:mime}:{});REC.r.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data)};
 REC.r.onstop=async()=>{clearInterval(REC.tm);REC.st.getTracks().forEach(t=>t.stop());REC.on=false;recUi();const dur=Math.round((Date.now()-REC.t0)/1000);if(REC.cancel||dur<1)return;
  const type=REC.r.mimeType||mime||"audio/webm",blob=new Blob(REC.chunks,{type});if(blob.size>MAXF)return toast("التسجيل كبير","bad");
  try{const ext=type.includes("mp4")?"m4a":"webm",url=await upload(blob,"voice."+ext,type);await sendRaw("voice",url,"voice."+ext,blob.size,dur,"")}catch(e){toast(e.message,"bad")}};
 REC.t0=Date.now();REC.r.start();REC.on=true;recUi();sfx.pop();vib(20);
 REC.tm=setInterval(()=>{const s=Math.round((Date.now()-REC.t0)/1000);$("recT").textContent=durTxt(s);if(s>=180)recStop(false)},300)}
function recStop(cancel){if(!REC.on)return;REC.cancel=!!cancel;if(REC.r&&REC.r.state!=="inactive")REC.r.stop();if(cancel){REC.on=false;recUi()}}
function recUi(){$("cinBox").classList.toggle("hide",REC.on);$("recb").classList.toggle("hide",!REC.on);$("cGo").classList.toggle("rec",REC.on);$("recT").textContent="0:00";goIcon()}
