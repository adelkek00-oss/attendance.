<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338ca">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>حضور وانصراف</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f9;--card:#fff;--tx:#141a2a;--mut:#6b7385;--bd:#e6e8f0;--pr:#4338ca;--pr2:#6366f1;--prs:#eef0ff;
--ok:#059669;--oks:#e7f8f1;--bad:#dc2626;--bads:#fdecec;--warn:#d97706;--warns:#fff5e6;--sh:0 1px 2px rgba(20,26,42,.04),0 4px 16px rgba(20,26,42,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0d111b;--card:#161c2a;--tx:#e9ecf5;--mut:#8c95a9;--bd:#252d3e;--prs:#22264a;--oks:#0f2a22;--bads:#2e1518;--warns:#2c2112;--sh:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.hide{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 22px 22px;margin:0 -16px 16px}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.top h1{margin:0;font-size:17px;font-weight:700;line-height:1.3}.top .s{font-size:12.5px;opacity:.85}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
.ct h2{margin:0;font-size:15.5px;font-weight:700}
.mut{color:var(--mut);font-size:13px}.sm{font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.2}.stat span{font-size:12px;color:var(--mut)}
/* clock */
.clock{font-size:48px;font-weight:800;text-align:center;direction:ltr;letter-spacing:1px;line-height:1.1;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--mut);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--prs);color:var(--pr)}
.chip.ok{background:var(--oks);color:var(--ok)}.chip.bad{background:var(--bads);color:var(--bad)}.chip.warn{background:var(--warns);color:var(--warn)}.chip.mu{background:var(--bd);color:var(--mut)}
@media(prefers-color-scheme:dark){.chip{color:#a5b4fc}}
.status{display:flex;justify-content:center;margin:12px 0 4px}
/* buttons & inputs */
button{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;color:#fff;background:var(--pr);transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gh{background:var(--prs);color:var(--pr)}.btn.ln{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto}
.btn svg{width:20px;height:20px}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.punch .btn{padding:16px;font-size:16px;border-radius:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px}
input,select,textarea{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);outline:none;margin-bottom:10px}
input:focus,select:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 3px var(--prs)}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--pr);box-shadow:var(--sh)}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.li:last-child{border-bottom:0;padding-bottom:0}.li:first-child{padding-top:0}
.li .x{flex:1;min-width:0}.li .t{font-weight:700}.li .d{font-size:12.5px;color:var(--mut)}
.li .n{font-weight:800;white-space:nowrap}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--prs);color:var(--pr)}
.dot.ok{background:var(--oks);color:var(--ok)}.dot.bad{background:var(--bads);color:var(--bad)}.dot.warn{background:var(--warns);color:var(--warn)}.dot.mu{background:var(--bd);color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:18px 0;font-size:14px}
.tw{overflow-x:auto;margin:0 -4px}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd)}
td{padding:10px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border-bottom:0}
/* payroll */
.pay{cursor:pointer}.pay .hd{display:flex;align-items:center;gap:12px}.pay .net{font-size:20px;font-weight:800}
.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}
.brk div{font-size:12px;color:var(--mut)}.brk b{display:block;font-size:14px;color:var(--tx)}
.total{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}
.total .mut{color:rgba(255,255,255,.8)}.total b{font-size:26px;font-weight:800}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--mut);font-size:11.5px;font-weight:700;cursor:pointer;position:relative}
.nav button svg{width:23px;height:23px}.nav button.on{color:var(--pr)}
@media(prefers-color-scheme:dark){.nav button.on{color:#a5b4fc}}
.badge{position:absolute;top:2px;left:calc(50% - 18px);background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:420px;margin:0 auto}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 10px 30px rgba(67,56,202,.35)}
.logo svg{width:40px;height:40px;color:#fff}
.login h1{text-align:center;margin:0;font-size:24px;font-weight:800}.login p{text-align:center;color:var(--mut);margin:6px 0 24px}
.pw{position:relative}.pw button{position:absolute;left:8px;top:8px;border:0;background:none;color:var(--mut);padding:4px;cursor:pointer}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:50vh;padding-bottom:70px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--pr);color:#fff;border-color:var(--pr)}
.msg.ad:not(.me){border-color:var(--pr2)}
.msg .w{font-size:11.5px;font-weight:700;color:var(--pr);margin-bottom:2px}.msg.me .w{display:none}
.msg .tm{font-size:10.5px;opacity:.6;margin-top:2px;text-align:left;direction:ltr}
.cbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;padding:8px 16px;background:var(--bg)}
.cbar .in{max-width:528px;margin:0 auto;display:flex;gap:8px}.cbar input{margin:0;border-radius:24px;background:var(--card)}
.cbar .btn{width:48px;height:48px;padding:0;border-radius:50%;flex:none}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,14,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 14px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:18px 4px 8px}
@media print{.top,.nav,.cbar,.noprint,.btn{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}.wrap{padding:0}}
</style></head><body>

<!-- ============ LOGIN ============ -->
<div id="vLogin" class="login hide">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
  <h1>حضور وانصراف</h1><p>سجّل دخولك علشان تبدأ</p>
  <div class="card">
    <label>اسم المستخدم</label><input id="lu" autocomplete="username" placeholder="اسمك زي ما المدير سجّله">
    <label>كلمة السر</label>
    <div class="pw"><input id="lp" type="password" autocomplete="current-password" placeholder="••••"><button type="button" id="eye" aria-label="إظهار"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="btn" id="bLogin">دخول</button>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="vApp" class="hide">
 <div class="wrap">
  <div class="top"><div class="in">
    <div class="av" id="av">م</div>
    <div style="flex:1;min-width:0"><h1 id="hi"></h1><div class="s" id="hs"></div></div>
    <button class="ib hide" id="bSet" aria-label="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="ib" id="bOut" aria-label="خروج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div></div>
  <div id="views"></div>
 </div>
 <div class="cbar hide" id="cbar"><div class="in"><input id="cin" placeholder="اكتب رسالة..." maxlength="1000"><button class="btn" id="csend" aria-label="إرسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z" transform="scale(-1,1) translate(-24,0)"/></svg></button></div></div>
 <nav class="nav"><div class="in" id="nav"></div></nav>
</div>
<div id="ov" class="ov hide"><div class="sheet"><div class="grip"></div><div id="sheet"></div></div></div>

<script>
/* ===== بيانات Supabase (نفس اللي قبل كده) ===== */
const SB_URL="https://roucwynlgkhupcimqnid.supabase.co";
const SB_KEY="sb_publishable_nbha79EcXJ7UEFWq13kYfg_CbQlrVww";
/* ============================================= */
const LATE_RULES="تأخير 16–30 د = 26ج · 31–60 د = 51ج · أكتر من 60 د = 77ج";
const $=i=>document.getElementById(i);
const H={apikey:SB_KEY,"Content-Type":"application/json"};if(SB_KEY.startsWith("eyJ"))H.Authorization="Bearer "+SB_KEY;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString("en-US");
const cairo=(o)=>new Date().toLocaleString(o.l||"en-CA",Object.assign({timeZone:"Africa/Cairo"},o.f||{}));
const curMonth=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Africa/Cairo"}).slice(0,7);
const AR_M=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const monName=ym=>AR_M[+ym.slice(5)-1]+" "+ym.slice(0,4);
const dayName=d=>new Date(d+"T12:00:00Z").toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"numeric",timeZone:"UTC"});
const addM=(ym,n)=>{const d=new Date(ym+"-15T00:00:00Z");d.setUTCMonth(d.getUTCMonth()+n);return d.toISOString().slice(0,7)};
const ini=s=>(String(s||"?").trim()[0]||"?");

async function rpc(fn,args){let r;
 try{r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(args||{})})}catch(e){throw new Error("مفيش اتصال بالإنترنت")}
 const j=await r.json().catch(()=>null);
 if(!r.ok){if(j&&(j.code==="PGRST202"||/Could not find the function/.test(j.message||"")))throw new Error("لازم تشغّل ملف التحديث (update.sql) في Supabase الأول");throw new Error((j&&j.message)||"حصلت مشكلة، جرّب تاني")}
 return j}
let tT;function toast(t,bad){const d=document.createElement("div");d.className="toast"+(bad?" bad":"");d.textContent=t;document.body.appendChild(d);clearTimeout(tT);document.querySelectorAll(".toast").forEach(x=>x!==d&&x.remove());tT=setTimeout(()=>d.remove(),3200)}
async function busy(btn,fn){if(!btn||btn.disabled)return;const h=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>';try{await fn()}catch(e){toast(e.message,1)}finally{if(btn.isConnected){btn.disabled=false;btn.innerHTML=h}}}
function sheet(html){$("sheet").innerHTML=html;$("ov").classList.remove("hide")}
function closeSheet(){$("ov").classList.add("hide")}
$("ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};

const IC={
 home:'<path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h2M2 10h20M6 6V4h12v2"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',
 today:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 money:'<rect x="2" y="5" width="20" height="14" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M6 9v.01M18 15v.01"/>',
 hand:'<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.1a4 4 0 0 1 0 7.8M22 21a7 7 0 0 0-4-6.3"/>',
 in:'<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
 pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>'
};
const svg=(k,s)=>`<svg viewBox="0 0 24 24" ${s?`width="${s}" height="${s}"`:""} fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

/* ============ session ============ */
let S={u:"",p:"",role:"",name:""};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("att2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("att2",JSON.stringify(S))}catch(e){}};
$("eye").onclick=()=>{$("lp").type=$("lp").type==="password"?"text":"password"};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("bLogin").click()};
$("bLogin").onclick=()=>busy($("bLogin"),async()=>{
 const u=$("lu").value.trim(),p=$("lp").value;if(!u||!p)throw new Error("اكتب اسم المستخدم وكلمة السر");
 const r=await rpc("att2_login",{p_user:u,p_pass:p});S={u,p,role:r.role,name:r.name};save();$("lp").value="";boot()});
$("bOut").onclick=()=>{if(!confirm("تسجيل خروج؟"))return;S={u:"",p:"",role:"",name:""};save();stopTimers();showLogin()};
function showLogin(){$("vApp").classList.add("hide");$("vLogin").classList.remove("hide")}

let timers=[];function stopTimers(){timers.forEach(clearInterval);timers=[]}
let view="",NAV=[],RENDER={};
function setNav(items){NAV=items;$("nav").innerHTML=items.map(([k,ic,t])=>`<button data-v="${k}">${svg(ic)}<span>${t}</span><i class="badge hide" id="bd_${k}"></i></button>`).join("");
 $("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)}}
function go(v){view=v;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("cbar").classList.toggle("hide",v!=="chat");
 (RENDER[v]||(()=>{}))();window.scrollTo(0,0);if(v==="chat")chatOpen()}
function badge(k,n){const b=$("bd_"+k);if(!b)return;b.textContent=n;b.classList.toggle("hide",!n)}
function V(html){$("views").innerHTML=html}

async function boot(){
 stopTimers();$("vLogin").classList.add("hide");$("vApp").classList.remove("hide");
 $("av").textContent=ini(S.role==="admin"?"م":S.name);
 $("hi").textContent=S.role==="admin"?"لوحة المدير":"أهلاً "+S.name;
 $("hs").textContent=cairo({l:"ar-EG",f:{weekday:"long",day:"numeric",month:"long"}});
 $("bSet").classList.toggle("hide",S.role!=="admin");
 chat.last=0;chat.list=[];
 if(S.role==="admin")await adminBoot();else await empBoot();

/* ============ helpers for attendance math ============ */
function days(a,b){const o=[];for(let d=new Date(a+"T00:00:00Z");d.toISOString().slice(0,10)<b;d.setUTCDate(d.getUTCDate()+1))o.push(d.toISOString().slice(0,10));return o}
function absentDays(rows,start,today,ym){const f=start>ym+"-01"?start:ym+"-01";return days(f,today).filter(d=>d.startsWith(ym)&&!rows.find(x=>x.day===d))}
function gps(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error("المتصفح مش بيدعم الموقع"));
 navigator.geolocation.getCurrentPosition(p=>ok(p.coords),()=>no(new Error("فعّل الموقع للمتصفح من إعدادات الموبايل")),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}

 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));$("fAdv").classList.toggle("hide",b.dataset.t!=="adv");$("fAdj").classList.toggle("hide",b.dataset.t!=="adj")});
 let sign=1;document.querySelectorAll("#adjT button").forEach(b=>b.onclick=()=>{sign=+b.dataset.s;document.querySelectorAll("#adjT button").forEach(x=>x.classList.toggle("on",x===b))});
 const re=async(m)=>{await adminLoad();toast(m);admAdv()};
 document.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>busy(b,async()=>{const id=b.dataset.ok;await rpc("att2_admin_decide_adv",{p_pin:S.p,p_id:+id,p_ok:true,p_month:$("dm"+id).value,p_parts:+$("dp"+id).value});await re("اتوافق على السلفة ✓")}));
 document.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>busy(b,async()=>{if(!confirm("رفض الطلب؟"))return;await rpc("att2_admin_decide_adv",{p_pin:S.p,p_id:+b.dataset.no,p_ok:false,p_month:null,p_parts:1});await re("اترفض الطلب")}));
 document.querySelectorAll("[data-da]").forEach(b=>b.onclick=()=>busy(b,async()=>{if(!confirm("حذف القسط ده؟"))return;await rpc("att2_admin_del_adv",{p_pin:S.p,p_id:+b.dataset.da});await re("اتحذف")}));
 document.querySelectorAll("[data-dj]").forEach(b=>b.onclick=()=>busy(b,async()=>{if(!confirm("حذف؟"))return;await rpc("att2_admin_del_adj",{p_pin:S.p,p_id:+b.dataset.dj});await re("اتحذف")}));
 $("bNA").onclick=()=>busy($("bNA"),async()=>{const v=+$("nA").value;if(!$("nE").value)throw new Error("أضف موظفين الأول");if(!(v>0))throw new Error("اكتب المبلغ");
  await rpc("att2_admin_add_adv",{p_pin:S.p,p_emp:$("nE").value,p_amount:v,p_note:$("nN").value,p_month:$("nM").value,p_parts:+$("nP").value});await re("اتسجلت السلفة ✓")});
 $("bNJ").onclick=()=>busy($("bNJ"),async()=>{const v=+$("jA").value;if(!$("jE").value)throw new Error("أضف موظفين الأول");if(!(v>0))throw new Error("اكتب المبلغ");
  await rpc("att2_admin_add_adj",{p_pin:S.p,p_emp:$("jE").value,p_month:mon,p_amount:v*sign,p_note:$("jN").value});await re("اتسجل ✓")});
}
function admEmps(){
 V(`<div class="card"><div class="ct"><h2>إضافة موظف</h2></div>
   <label>الاسم (ده اللي هيدخل بيه)</label><input id="eN" placeholder="مثلاً: أحمد محمد">
   <div class="row"><div><label>كلمة السر</label><input id="eP" inputmode="numeric" placeholder="4 أرقام أو أكتر"></div><div><label>المرتب</label><input id="eS" type="number" inputmode="numeric" value="4000"></div></div>
   <button class="btn" id="bAE">إضافة</button></div>
  <div class="sec">الموظفين (${R.emps.length})</div>
  <div class="card">${R.emps.map((e,i)=>`<div class="li"><div class="dot">${esc(ini(e.name))}</div><div class="x"><div class="t">${esc(e.name)}</div><div class="d">كلمة السر: ${esc(e.pin)} · المرتب: ${fmt(salOf(e.name))} ج</div></div><button class="btn gh sm" data-ed="${i}">تعديل</button></div>`).join("")||'<div class="empty">مفيش موظفين لسه</div>'}</div>`);
 $("bAE").onclick=()=>busy($("bAE"),async()=>{const n=$("eN").value.trim(),p=$("eP").value.trim(),s=+$("eS").value;
  if(!n||!p)throw new Error("اكتب الاسم وكلمة السر");if(AX.user&&n.toLowerCase()===AX.user.toLowerCase())throw new Error("الاسم ده نفس اسم دخول المدير، اختار اسم تاني");
  if(R.emps.some(e=>e.name===n))throw new Error("الموظف ده موجود، استخدم زر تعديل");
  await rpc("att_admin_add_emp",{p_pin:S.p,p_name:n,p_emp_pin:p});await rpc("att2_admin_set_salary",{p_pin:S.p,p_emp:n,p_salary:s>=0?s:4000});await adminLoad();toast("اتضاف ✓");admEmps()});
 document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{const e=R.emps[+b.dataset.ed];
  sheet(`<div class="ct"><h2>${esc(e.name)}</h2></div>
   <label>كلمة السر</label><input id="xP" value="${esc(e.pin)}" inputmode="numeric">
   <label>المرتب الأساسي</label><input id="xS" type="number" inputmode="numeric" value="${salOf(e.name)}">
   <button class="btn" id="bXS">حفظ</button>
   <button class="btn ln" id="bXD" style="margin-top:8px;color:var(--bad)">حذف الموظف</button>`);
  $("bXS").onclick=()=>busy($("bXS"),async()=>{const p=$("xP").value.trim(),s=+$("xS").value;if(!p)throw new Error("اكتب كلمة السر");
   if(p!==e.pin)await rpc("att_admin_add_emp",{p_pin:S.p,p_name:e.name,p_emp_pin:p});
   await rpc("att2_admin_set_salary",{p_pin:S.p,p_emp:e.name,p_salary:s});await adminLoad();closeSheet();toast("اتحفظ ✓");admEmps()});
  $("bXD").onclick=()=>busy($("bXD"),async()=>{if(!confirm("حذف "+e.name+"؟ سجلاته القديمة هتفضل محفوظة"))return;
   await rpc("att_admin_del_emp",{p_pin:S.p,p_name:e.name});await adminLoad();closeSheet();toast("اتحذف");admEmps()})});
}
function admSet(){
 document.querySelectorAll("#nav button").forEach(b=>b.classList.remove("on"));
 V(`<div class="sec">الإعدادات</div>
  <div class="card"><div class="ct"><h2>${svg("pin",18)} موقع المحل</h2>${RC.lat?'<span class="chip ok">متحدد</span>':'<span class="chip warn">مش متحدد</span>'}</div>
   <p class="mut sm" style="margin-top:0">اقف جوه المحل ودوس الزرار. الموظف مش هيقدر يسجل حضور غير وهو في المسافة دي.</p>
   <label>المسافة المسموحة (متر)</label><input id="sR" type="number" inputmode="numeric" value="${RC.radius||150}">
   <button class="btn gh" id="bLoc">حدد موقع المحل دلوقتي</button></div>
  <div class="card"><div class="ct"><h2>اسم دخول المدير</h2></div>
   <p class="mut sm" style="margin-top:0">الموظفين مش بيشوفوا أي حاجة عن دخول المدير. انت بتدخل من نفس الشاشة باسمك ده.</p>
   <input id="sU" value="${esc(AX.user||"admin")}"><button class="btn gh" id="bU">حفظ الاسم</button></div>
  <div class="card"><div class="ct"><h2>كلمة سر المدير</h2></div>
   <input id="sP" type="password" placeholder="كلمة السر الجديدة"><input id="sP2" type="password" placeholder="اكتبها تاني"><button class="btn gh" id="bP">تغيير كلمة السر</button></div>`);
 $("bLoc").onclick=()=>busy($("bLoc"),async()=>{const c=await gps();await rpc("att_admin_set_loc",{p_pin:S.p,p_lat:c.latitude,p_lng:c.longitude,p_radius:+$("sR").value||150});await adminLoad();toast("اتحفظ الموقع ✓ (الدقة ~"+Math.round(c.accuracy)+" م)");admSet()});
 $("bU").onclick=()=>busy($("bU"),async()=>{const u=$("sU").value.trim();if(R.emps.some(e=>e.name.toLowerCase()===u.toLowerCase()))throw new Error("الاسم ده مستخدم لموظف");
  await rpc("att2_admin_set_user",{p_pin:S.p,p_user:u});S.u=u;save();await adminLoad();toast("اتغير اسم الدخول ✓")});
 $("bP").onclick=()=>busy($("bP"),async()=>{const p=$("sP").value;if(p.length<4)throw new Error("كلمة السر لازم 4 حروف أو أرقام على الأقل");if(p!==$("sP2").value)throw new Error("الكلمتين مش زي بعض");
  await rpc("att_admin_set_pin",{p_pin:S.p,p_new:p});S.p=p;save();$("sP").value=$("sP2").value="";toast("اتغيرت كلمة السر ✓")});
}

/* =====================================================
   الشات
   ===================================================== */
const chat={last:0,list:[],seen:0};
try{chat.seen=+localStorage.getItem("att2_seen")||0}catch(e){}
async function chatPoll(){try{const m=await rpc("att2_chat_list",{p_user:S.u,p_pass:S.p,p_after:chat.last});
 if(m.length){chat.list=chat.list.concat(m).slice(-200);chat.last=m[m.length-1].id;if(view==="chat")chatRender(true)}
 if(view==="chat")chatMarkSeen();else{const me=S.role==="admin"?"المدير":S.name;badge("chat",chat.list.filter(x=>x.id>chat.seen&&x.sender!==me).length)}}catch(e){}}
function chatMarkSeen(){chat.seen=chat.last;try{localStorage.setItem("att2_seen",chat.seen)}catch(e){}badge("chat",0)}
function chatView(){V('<div class="chat" id="cl"></div>');chatRender(true)}
function chatOpen(){chatMarkSeen();setTimeout(()=>$("cin")&&$("cin").focus(),100)}
function chatRender(scroll){const el=$("cl");if(!el)return;const me=S.role==="admin"?"المدير":S.name;
 el.innerHTML=chat.list.length?chat.list.map(m=>{const mine=m.sender===me;const tm=new Date(m.created_at).toLocaleString("ar-EG",{timeZone:"Africa/Cairo",hour:"numeric",minute:"2-digit",day:"numeric",month:"numeric"});
  return`<div class="msg ${mine?"me":""} ${m.is_admin?"ad":""}"><div class="w">${esc(m.sender)}${m.is_admin?" ⭐":""}</div>${esc(m.body)}<div class="tm">${tm}</div></div>`}).join(""):'<div class="empty">لسه مفيش رسايل. ابدأ الكلام 👋</div>';
 if(scroll)setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),30)}
$("csend").onclick=()=>busy($("csend"),async()=>{const t=$("cin").value.trim();if(!t)return;await rpc("att2_chat_send",{p_user:S.u,p_pass:S.p,p_body:t});$("cin").value="";await chatPoll()});
$("cin").onkeydown=e=>{if(e.key==="Enter")$("csend").click()};

/* ============ start ============ */
if(S.u&&S.p&&S.role)boot();else showLogin();
</script></body></html>
